<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Order — THE BACKYARD</title>
<style>body{font-family:Arial;margin:0;background:#fff;color:#183a33}.wrap{max-width:520px;margin:70px auto;padding:25px;text-align:center}.logo{font-weight:900;letter-spacing:3px;color:#075b49}.id{font-size:30px;color:#bd2735;font-weight:900;margin:18px}.status{font-size:22px;font-weight:800;color:#075b49}.bar{height:8px;background:#eee;border-radius:10px;margin:25px 0}.fill{height:100%;background:#075b49;border-radius:10px;width:20%}.muted{color:#738078;font-size:13px}</style></head>
<body><div class="wrap"><div class="logo">THE BACKYARD</div><h1>Order Tracking</h1><div class="id" id="id">—</div><div class="status" id="status">Loading…</div><div class="bar"><div class="fill" id="fill"></div></div><div class="muted" id="details"></div></div>
<script>
const id=new URLSearchParams(location.search).get('id');document.getElementById('id').textContent=id||'No order ID';
async function load(){if(!id)return;try{let r=await fetch('/api/orders/'+encodeURIComponent(id));let x=await r.json();if(!r.ok)throw 0;document.getElementById('status').textContent=x.status.replaceAll('_',' ');let map={NEW:10,ACCEPTED:25,PREPARING:50,READY:70,OUT_FOR_DELIVERY:88,COMPLETED:100,CANCELLED:100};document.getElementById('fill').style.width=(map[x.status]||10)+'%';document.getElementById('details').textContent='Total ₹'+x.total+' • '+x.payment+' • Updated '+new Date(x.updatedAt).toLocaleTimeString();}catch(e){document.getElementById('status').textContent='Order not found'}}load();setInterval(load,8000);
</script></body></html>
