<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>THE BACKYARD Admin</title>
<style>:root{--g:#075b49;--r:#bd2735;--line:#e7e4db;--muted:#738078}*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f7f5ed;color:#183a33}.top{background:#075b49;color:#fff;padding:18px;display:flex;justify-content:space-between}.wrap{max-width:1050px;margin:auto;padding:20px}.order{background:#fff;border:1px solid var(--line);border-radius:10px;padding:17px;margin-bottom:12px}.row{display:flex;justify-content:space-between;gap:10px}.id{font-weight:900;color:var(--r)}.items{font-size:13px;color:#566860;margin:12px 0;line-height:1.6}.actions button{border:0;padding:9px 12px;border-radius:7px;margin:4px 4px 0 0;font-weight:800;cursor:pointer}.accept{background:var(--g);color:#fff}.cancel{background:#eee;color:#555}.status{font-size:12px;text-transform:uppercase;color:var(--g);font-weight:900}.login{max-width:360px;margin:80px auto;background:#fff;padding:25px;border-radius:10px}.login input{width:100%;padding:11px;margin:7px 0;border:1px solid var(--line);border-radius:7px}.login button{width:100%;padding:11px;background:var(--g);color:#fff;border:0;border-radius:7px;font-weight:800}</style></head>
<body><div class="top"><b>THE BACKYARD — ADMIN</b><span id="count"></span></div><main class="wrap"><div id="orders">Loading…</div></main>
<script>
const key=prompt('Enter admin key');if(!key)location.href='/';
async function load(){let r=await fetch('/api/admin/orders',{headers:{'x-admin-key':key}});if(r.status===401){alert('Invalid admin key');location.href='/';return}let data=await r.json();document.getElementById('count').textContent=data.length+' orders';document.getElementById('orders').innerHTML=data.map(o=>`<article class="order"><div class="row"><div><div class="id">${o.orderId}</div><b>${o.customer.name}</b> · ${o.customer.phone}</div><div class="status">${o.status}</div></div><div class="items">${o.items.map(i=>`${i.qty} × ${i.name} — ₹${i.price*i.qty}`).join('<br>')}<br><b>Total: ₹${o.total}</b><br>Payment: ${o.payment}<br>Location: <a href="${o.customer.location}" target="_blank">${o.customer.location}</a>${o.note?'<br>Note: '+o.note:''}</div><div class="actions">${['ACCEPTED','PREPARING','READY','OUT_FOR_DELIVERY','COMPLETED','CANCELLED'].map(s=>`<button class="${s==='CANCELLED'?'cancel':'accept'}" onclick="update('${o.orderId}','${s}','${key}')">${s.replaceAll('_',' ')}</button>`).join('')}</div></article>`).join('')||'<p>No orders yet.</p>'}async function update(id,status,key){await fetch('/api/admin/orders/'+id,{method:'PATCH',headers:{'Content-Type':'application/json','x-admin-key':key},body:JSON.stringify({status})});load()}load();setInterval(load,5000);
</script></body></html>
